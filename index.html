<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fiche sécu PLC">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Fiches de sécurité · Plongée Loisirs Chalon</title>
<!-- © Plongée Loisirs Chalon (PLC71). Usage réservé au club. Reproduction et diffusion interdites.
     Le contenu de l'application est chiffré : il ne s'ouvre qu'avec le code d'accès du club. -->
<style>
:root{color-scheme:light dark;--tint:#007aff;--bg:#f2f2f7;--card:#fff;--label:#000;--sec:rgba(60,60,67,.62);--ter:rgba(60,60,67,.3);--sep:rgba(60,60,67,.2);--red:#d70015}
@media (prefers-color-scheme:dark){:root{--tint:#0a84ff;--bg:#000;--card:#1c1c1e;--label:#fff;--sec:rgba(235,235,245,.62);--ter:rgba(235,235,245,.3);--sep:rgba(84,84,88,.62);--red:#ff6961}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--label);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
.box{width:100%;max-width:380px;text-align:center;animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.logo{width:104px;height:104px;border-radius:24px;object-fit:contain;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.12),0 0 0 .5px var(--sep)}
h1{margin:20px 0 4px;font-size:28px;font-weight:700;letter-spacing:-.025em}
.sub{margin:0 0 28px;color:var(--sec);font-size:16px}
.field{background:var(--card);border-radius:14px;display:flex;align-items:center;padding:0 16px;min-height:54px;text-align:left}
.field label{font-size:17px;flex:none;margin-right:12px}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:17px;color:var(--label);padding:14px 0;text-align:right;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--ter)}
button{width:100%;min-height:52px;margin-top:14px;border:0;border-radius:14px;background:var(--tint);color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer;transition:transform .12s,opacity .12s}
button:active{transform:scale(.98);opacity:.85}
button:disabled{opacity:.45}
.msg{min-height:22px;margin-top:14px;font-size:15px;color:var(--red)}
.msg.info{color:var(--sec)}
.copy{margin-top:30px;font-size:12px;color:var(--ter)}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="logo.jpg" alt="Plongée Loisirs Chalon">
  <h1>Fiches de sécurité</h1>
  <p class="sub">Plongée Loisirs Chalon</p>
  <form id="f" autocomplete="off">
    <div class="field"><label for="code">Code</label><input id="code" type="password" placeholder="Code d'accès du club" autocapitalize="off" autocorrect="off" spellcheck="false" required></div>
    <button id="go" type="submit">Entrer</button>
  </form>
  <div id="msg" class="msg info">Chargement…</div>
  <div class="copy">© Plongée Loisirs Chalon (PLC71) · Usage réservé au club</div>
</div>
<script>
'use strict';
(function(){
  const CLE = 'plc_cle_v1';
  const msg = document.getElementById('msg');
  const form = document.getElementById('f');
  const input = document.getElementById('code');
  const go = document.getElementById('go');
  const setMsg = (t, info) => { msg.textContent = t; msg.className = 'msg' + (info ? ' info' : ''); };
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  let pkg = null;

  if('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  if(!(window.crypto && crypto.subtle)){
    setMsg("Ce navigateur ne peut pas ouvrir l'application. Utilisez Safari ou Chrome à jour, via l'adresse https du club.");
    go.disabled = true; return;
  }

  async function derive(code, salt, iter){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(salt), iterations:iter, hash:'SHA-256'}, base, 256);
  }
  async function decrypt(raw){
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(pkg.iv)}, key, b64(pkg.ct));
    return new TextDecoder().decode(pt);
  }
  function launch(html){
    document.open();
    document.write(html);
    document.close();
  }
  function remember(code, raw){
    try { localStorage.setItem(CLE, JSON.stringify({c:code, s:pkg.salt, k:toB64(raw)})); } catch(e){}
  }
  async function openWith(code, rawB64){
    const raw = rawB64 ? b64(rawB64).buffer : await derive(code, pkg.salt, pkg.iter);
    const html = await decrypt(raw);
    remember(code, raw);
    launch(html);
  }

  async function start(){
    try {
      const r = await fetch('app.bin.json', {cache:'no-cache'});
      if(!r.ok) throw new Error('http ' + r.status);
      pkg = await r.json();
    } catch(e){
      setMsg("Impossible de charger l'application. À la première ouverture, une connexion est nécessaire.");
      go.disabled = true; return;
    }
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(CLE) || 'null'); } catch(e){}
    if(saved && saved.c){
      setMsg('Ouverture…', true);
      try { await openWith(saved.c, saved.s === pkg.salt ? saved.k : null); return; }
      catch(e){
        try { localStorage.removeItem(CLE); } catch(_){}
        setMsg("Le code d'accès du club a changé. Saisissez le nouveau code.");
        input.focus(); return;
      }
    }
    setMsg('', true);
    input.focus();
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const code = input.value.trim();
    if(!code || !pkg) return;
    go.disabled = true; setMsg('Vérification…', true);
    try { await openWith(code, null); }
    catch(err){ go.disabled = false; setMsg('Code incorrect.'); input.select(); }
  });

  start();
})();
</script>
</body>
</html>
